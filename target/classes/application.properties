spring.application.name=interview-booth-backend
server.port=${PORT:8080}

# ---------- Database ----------
# Default: H2 in-memory (zero setup, resets on every restart) - good for building/demo.
spring.datasource.url=jdbc:h2:mem:interviewbooth
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# When ready for a real DB, comment the H2 block above and uncomment this MySQL block:
# spring.datasource.url=jdbc:mysql://localhost:3306/interview_booth?createDatabaseIfNotExist=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Change this secret before deploying anywhere real. Must be at least 32 characters.
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_1234567890
app.jwt.expiration-ms=86400000

# ---------- AI (Google Gemini - free tier) ----------
# Get a free key from https://aistudio.google.com (no credit card needed) and set it
# as an environment variable, never commit it into this file.
# On your machine: export GEMINI_API_KEY=AIza...
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
